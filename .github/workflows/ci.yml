name: Kopetro checks

on:
  pull_request:
  push:
    branches: [main, 'kopetro/m1', 'kopetro/m2', 'kopetro/m3', 'kopetro/m4', 'kopetro/m5', 'kopetro/m6']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_EMAIL: admin@example.com
      SEED_DEMO: 'true'
      COMPOSE_PROFILES: mail-test
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: voting@example.com
      KOPETRO_DISPOSABLE_TEST_DB: '1'
      SMTP_REQUIRE_TLS: 'false'
    steps:
      - uses: actions/checkout@v5
      - name: Generate ephemeral test credentials
        run: |
          for name in POSTGRES_PASSWORD SESSION_SECRET ADMIN_PASSWORD; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --build --wait
      - name: Verify election workflows, SMTP and exports over HTTPS
        run: |
          bash scripts/smoke-m2.sh
          bash scripts/smoke-m3.sh
          docker compose exec -T postgres psql -U kopetro -d kopetro -c 'TRUNCATE "AdminLoginLimit";'
          bash scripts/smoke-m1.sh
          bash scripts/smoke-m4.sh
          bash scripts/smoke-m5.sh
      - name: Verify mobile E2E and the 200-voter load
        run: bash scripts/test-m6.sh
      - name: Verify backup and database restore
        run: bash scripts/smoke-backup.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
